<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Seedtobloom</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/site.css">
<style>html,body{background:var(--terre);}</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/Header.jsx"></script>
  <script type="text/babel" src="components/Footer.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const contactStyles = {
      hero: {
        background: 'var(--terre)',
        color: 'var(--paille)',
        padding: '120px 0 96px',
        position: 'relative',
      },
      heroInner: {
        maxWidth: 1240, margin: '0 auto', padding: '0 40px',
        display: 'grid', gridTemplateColumns: 'minmax(0, 1.3fr) minmax(0, 1fr)',
        gap: 56, alignItems: 'end',
      },
      crumbs: {
        fontFamily: 'var(--font-micro)', fontSize: 11, letterSpacing: '0.22em',
        textTransform: 'uppercase', color: 'var(--fg-on-terre-muted)',
        display: 'inline-flex', alignItems: 'center', gap: 10, margin: '0 0 28px',
      },
      crumbsDot: { width: 22, height: 1, background: 'var(--paille)', opacity: 0.55 },
      h1: {
        fontFamily: 'var(--font-display)', fontWeight: 300,
        fontSize: 'clamp(48px, 6vw, 88px)', lineHeight: 1, letterSpacing: '-0.015em',
        color: 'var(--paille)', margin: 0, textWrap: 'balance',
      },
      emp: { fontStyle: 'italic', color: 'var(--glycine)', fontWeight: 400 },
      intro: {
        fontFamily: 'var(--font-body)', fontSize: 19, lineHeight: 1.55,
        color: 'var(--paille)', margin: 0, paddingBottom: 8, maxWidth: 460,
      },
      body: {
        background: 'var(--bone)',
        padding: '120px 0',
      },
      bodyInner: {
        maxWidth: 1240, margin: '0 auto', padding: '0 40px',
        display: 'grid', gridTemplateColumns: 'minmax(0, 1.2fr) minmax(0, 1fr)',
        gap: 64, alignItems: 'start',
      },
      formCard: {
        background: 'var(--bg-card)',
        border: '1px solid var(--line-on-bone)',
        padding: '40px 40px 36px',
        position: 'relative',
      },
      formLabel: {
        position: 'absolute', top: -9, left: 28,
        background: 'var(--bg-card)', padding: '0 12px',
        fontFamily: 'var(--font-micro)', fontSize: 10, fontWeight: 500,
        letterSpacing: '0.30em', textTransform: 'uppercase', color: 'var(--terre-600)',
      },
      formH: {
        fontFamily: 'var(--font-display)', fontWeight: 300,
        fontSize: 30, lineHeight: 1.12, margin: '0 0 8px', color: 'var(--terre)',
      },
      formSub: {
        fontFamily: 'var(--font-body)', fontSize: 15, lineHeight: 1.55,
        color: 'var(--terre-600)', margin: '0 0 28px', maxWidth: 460,
      },
      field: { display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 22 },
      fieldLabel: {
        fontFamily: 'var(--font-micro)', fontSize: 10, fontWeight: 500,
        letterSpacing: '0.22em', textTransform: 'uppercase', color: 'var(--terre-600)',
      },
      input: {
        width: '100%', padding: '14px 16px',
        fontFamily: 'var(--font-body)', fontSize: 16,
        background: 'var(--bone)', border: '1px solid var(--line-on-bone)',
        color: 'var(--terre)', borderRadius: 4, outline: 'none',
        transition: 'border-color 240ms var(--ease-out-soft)',
      },
      textarea: {
        width: '100%', padding: '14px 16px', minHeight: 130,
        fontFamily: 'var(--font-body)', fontSize: 16,
        background: 'var(--bone)', border: '1px solid var(--line-on-bone)',
        color: 'var(--terre)', borderRadius: 4, outline: 'none', resize: 'vertical',
      },
      sideCol: { display: 'flex', flexDirection: 'column', gap: 36, paddingTop: 8 },
      sideBlock: { display: 'flex', flexDirection: 'column', gap: 8 },
      sideLabel: {
        fontFamily: 'var(--font-micro)', fontSize: 10,
        letterSpacing: '0.26em', textTransform: 'uppercase', color: 'var(--terre-600)',
      },
      sideVal: {
        fontFamily: 'var(--font-display)', fontStyle: 'italic',
        fontSize: 22, lineHeight: 1.25, color: 'var(--terre)', margin: 0,
      },
      sideMuted: { color: 'var(--terre-600)' },
    };

    function Field({ label, type = 'text', placeholder, name, textarea }) {
      const [focused, setFocused] = React.useState(false);
      const sharedStyle = {
        ...(textarea ? contactStyles.textarea : contactStyles.input),
        borderColor: focused ? 'var(--terre)' : 'var(--line-on-bone)',
      };
      return (
        <label style={contactStyles.field}>
          <span style={contactStyles.fieldLabel}>{label}</span>
          {textarea
            ? <textarea name={name} placeholder={placeholder} style={sharedStyle}
                        onFocus={() => setFocused(true)} onBlur={() => setFocused(false)} />
            : <input type={type} name={name} placeholder={placeholder} style={sharedStyle}
                     onFocus={() => setFocused(true)} onBlur={() => setFocused(false)} />}
        </label>
      );
    }

    function Page() {
      return (
        <>
          <Header />
          <main>
            <section style={contactStyles.hero}>
              <div style={contactStyles.heroInner}>
                <div>
                  <p style={contactStyles.crumbs}>
                    <span style={contactStyles.crumbsDot} />
                    Accueil · Contact
                  </p>
                  <h1 style={contactStyles.h1}>
                    Racontez-moi votre <em style={contactStyles.emp}>projet</em>.
                  </h1>
                </div>
                <p style={contactStyles.intro}>
                  Trente minutes au téléphone pour comprendre où vous en êtes. Pas de devis surprise, pas de pression — juste un échange honnête pour voir si on doit travailler ensemble.
                </p>
              </div>
            </section>

            <section style={contactStyles.body}>
              <div style={contactStyles.bodyInner}>
                <form style={contactStyles.formCard} onSubmit={e => e.preventDefault()}>
                  <span style={contactStyles.formLabel}>Appel découverte</span>
                  <h2 style={contactStyles.formH}>Quelques infos pour préparer.</h2>
                  <p style={contactStyles.formSub}>Je vous réponds sous 48h ouvrées avec deux créneaux d'appel.</p>

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
                    <Field label="Votre prénom" name="firstname" placeholder="Léa" />
                    <Field label="Nom" name="lastname" placeholder="Martin" />
                  </div>
                  <Field label="Email" type="email" name="email" placeholder="lea@assoenvol.fr" />
                  <Field label="Structure" name="org" placeholder="Envol environnement" />
                  <Field label="Votre projet en quelques lignes" name="msg" textarea
                         placeholder="On a besoin de refondre nos supports de communication pour le terrain. On part de zéro côté charte." />

                  <button type="submit" className="btn btn--glycine" style={{ marginTop: 8, padding: '16px 30px' }}>
                    Envoyer la demande
                  </button>
                </form>

                <aside style={contactStyles.sideCol}>
                  <div style={contactStyles.sideBlock}>
                    <span style={contactStyles.sideLabel}>Email direct</span>
                    <p style={contactStyles.sideVal}>bonjour@seedtobloom.fr</p>
                  </div>
                  <div style={contactStyles.sideBlock}>
                    <span style={contactStyles.sideLabel}>Studio</span>
                    <p style={contactStyles.sideVal}>Lille, France</p>
                    <p style={{ ...contactStyles.sideVal, ...contactStyles.sideMuted, fontSize: 15, fontStyle: 'normal', fontFamily: 'var(--font-body)' }}>
                      Sur rendez-vous uniquement
                    </p>
                  </div>
                  <div style={contactStyles.sideBlock}>
                    <span style={contactStyles.sideLabel}>Disponibilités</span>
                    <p style={contactStyles.sideVal}>Prochaine ouverture : juin 2026</p>
                  </div>
                  <div style={contactStyles.sideBlock}>
                    <span style={contactStyles.sideLabel}>Suivre</span>
                    <p style={contactStyles.sideVal}>Instagram · LinkedIn</p>
                  </div>
                </aside>
              </div>
            </section>
          </main>
          <Footer />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
  </script>
</body>
</html>
